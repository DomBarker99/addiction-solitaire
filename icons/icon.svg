<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512">
  <!-- Source for the app icons. The PNGs in this folder are rendered from it. -->
  <defs>
    <radialGradient id="felt" cx="50%" cy="15%" r="95%">
      <stop offset="0" stop-color="#18975a" />
      <stop offset="1" stop-color="#0b5530" />
    </radialGradient>
    <path id="heart" d="M50 90C46 86 9 61 5 37 2 19 14 7 29 7c10 0 17 6 21 15 4-9 11-15 21-15 15 0 27 12 24 30C91 61 54 86 50 90Z" />
    <path id="spade" d="M50 5C44 20 8 41 8 62c0 14 11 22 22 22 8 0 14-4 17-9-1 9-5 15-13 20h32c-8-5-12-11-13-20 3 5 9 9 17 9 11 0 22-8 22-22C92 41 56 20 50 5Z" />
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect id="background" width="512" height="512" rx="112" fill="url(#felt)" />

  <g id="art" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="60" text-anchor="middle">
    <!-- Left column: 2, 3, 4 of hearts -->
    <g fill="#c41e3a">
      <rect x="92" y="112" width="152" height="88" rx="14" fill="#fffdf7" filter="url(#shadow)" />
      <text x="146" y="177">2</text>
      <use xlink:href="#heart" href="#heart" transform="translate(172 130) scale(0.52)" />
      <rect x="92" y="212" width="152" height="88" rx="14" fill="#fffdf7" filter="url(#shadow)" />
      <text x="146" y="277">3</text>
      <use xlink:href="#heart" href="#heart" transform="translate(172 230) scale(0.52)" />
      <rect x="92" y="312" width="152" height="88" rx="14" fill="#fffdf7" filter="url(#shadow)" />
      <text x="146" y="377">4</text>
      <use xlink:href="#heart" href="#heart" transform="translate(172 330) scale(0.52)" />
    </g>
    <!-- Right column: 2, 3 of spades, then a gap -->
    <g fill="#1d1d1f">
      <rect x="268" y="112" width="152" height="88" rx="14" fill="#fffdf7" filter="url(#shadow)" />
      <text x="322" y="177">2</text>
      <use xlink:href="#spade" href="#spade" transform="translate(348 130) scale(0.52)" />
      <rect x="268" y="212" width="152" height="88" rx="14" fill="#fffdf7" filter="url(#shadow)" />
      <text x="322" y="277">3</text>
      <use xlink:href="#spade" href="#spade" transform="translate(348 230) scale(0.52)" />
    </g>
    <rect x="271" y="315" width="146" height="82" rx="12" fill="rgba(0,0,0,0.12)" stroke="rgba(255,255,255,0.45)" stroke-width="5" stroke-dasharray="16 11" />
  </g>
</svg>
